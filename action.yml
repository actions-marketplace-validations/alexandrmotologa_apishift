name: 'APIShift API Auto-Migrator'
description: 'Autonomous API migration engine that transforms ASTs, heals test regressions, and opens verified GitHub PRs.'
author: 'Alexandr Motologa'

branding:
  icon: 'refresh-cw'
  color: 'blue'

inputs:
  recipe:
    description: 'Migration recipe ID (e.g. openai-v0-to-v1, stripe-v12-to-v14) or path to recipe JSON'
    required: true
  repo-path:
    description: 'Target repository path to scan and migrate'
    required: false
    default: '.'
  test-command:
    description: 'Test suite command to execute inside sandbox'
    required: false
    default: 'npm test'
  sandbox-mode:
    description: 'Sandbox runner mode: docker, local, or auto'
    required: false
    default: 'auto'
  auto-pr:
    description: 'Automatically create a branch and open a verified GitHub Pull Request'
    required: false
    default: 'false'
  github-token:
    description: 'GitHub token with contents:write and pull-requests:write permissions'
    required: false
    default: ${{ github.token }}

runs:
  using: 'composite'
  steps:
    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install Action Engine Dependencies
      shell: bash
      run: |
        cd "${{ github.action_path }}"
        npm ci
        npm run build

    - name: Run APIShift Migration Engine
      id: migrate
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        node "${{ github.action_path }}/dist/cli.js" migrate \
          --repo "${{ inputs.repo-path }}" \
          --recipe "${{ inputs.recipe }}" \
          --test-cmd "${{ inputs.test-command }}" \
          --sandbox "${{ inputs.sandbox-mode }}" \
          ${{ inputs.auto-pr == 'true' && '--auto-pr' || '' }}
